<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc"><title id="title">AI 给方案，你来决定做到哪里</title><desc id="desc">完整的学习主线，是在已确认范围内做成一个小平台。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="515" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">AI 给方案，你来决定做到哪里</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">完整的学习主线，是在已确认范围内做成一个小平台。</text><rect x="36" y="126" width="288" height="278" rx="14" fill="#eef6ec" stroke="#d5e3dc"/><text x="56" y="167" font-size="24" fill="#17352f" font-weight="700">本次必做</text><text x="56" y="216" font-size="18" fill="#17352f" font-weight="400">查到设备和位置</text><text x="56" y="259" font-size="18" fill="#17352f" font-weight="400">看模拟点值</text><text x="56" y="302" font-size="18" fill="#17352f" font-weight="400">完成本地演练</text><text x="56" y="345" font-size="18" fill="#17352f" font-weight="400">保留必要的权限和失败处理</text><rect x="356" y="126" width="288" height="278" rx="14" fill="#fff9e9" stroke="#d5e3dc"/><text x="376" y="167" font-size="24" fill="#17352f" font-weight="700">以后选做</text><text x="376" y="216" font-size="18" fill="#17352f" font-weight="400">真实 AIRIOT 只读接入</text><text x="376" y="259" font-size="18" fill="#17352f" font-weight="400">更多图表</text><text x="376" y="302" font-size="18" fill="#17352f" font-weight="400">自主调整页面外观</text><text x="376" y="345" font-size="18" fill="#17352f" font-weight="400">有条件、有余力时再做</text><rect x="676" y="126" width="288" height="278" rx="14" fill="#f8efed" stroke="#d5e3dc"/><text x="696" y="167" font-size="24" fill="#17352f" font-weight="700">本次不做</text><text x="696" y="216" font-size="18" fill="#17352f" font-weight="400">远程重启真实设备</text><text x="696" y="259" font-size="18" fill="#17352f" font-weight="400">发送真实短信邮件</text><text x="696" y="302" font-size="18" fill="#17352f" font-weight="400">费用与节能率推算</text><text x="696" y="345" font-size="18" fill="#17352f" font-weight="400">未经依据的 AI 故障预测</text><text x="40" y="454" font-size="20" fill="#126b53" font-weight="600">学生的决定：把 AI 额外加入的“短信提醒、远程重启”删掉，再保存范围文件。</text><text x="36" y="493" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>