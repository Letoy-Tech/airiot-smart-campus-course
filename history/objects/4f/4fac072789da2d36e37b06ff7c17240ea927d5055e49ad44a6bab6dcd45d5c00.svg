<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从提示词到自己的文件</title><desc id="desc">不要只在聊天窗口里向下滚动：每轮都保存一份产物。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="540" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">从提示词到自己的文件</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">不要只在聊天窗口里向下滚动：每轮都保存一份产物。</text><rect x="36" y="120" width="272" height="145" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="56" y="158" font-size="23" fill="#126b53" font-weight="700">01 复制要求</text><text x="56" y="198" font-size="18" fill="#17352f" font-weight="400">教程里点“复制提示词”</text><text x="56" y="229" font-size="18" fill="#17352f" font-weight="400">不要复制整页</text><rect x="364" y="120" width="272" height="145" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="384" y="158" font-size="23" fill="#126b53" font-weight="700">02 发给 AI</text><text x="384" y="198" font-size="18" fill="#17352f" font-weight="400">切到 AI 输入框，粘贴</text><text x="384" y="229" font-size="18" fill="#17352f" font-weight="400">点发送，等回答结束</text><rect x="692" y="120" width="272" height="145" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="712" y="158" font-size="23" fill="#126b53" font-weight="700">03 检查回答</text><text x="712" y="198" font-size="18" fill="#17352f" font-weight="400">对照示例检查内容</text><text x="712" y="229" font-size="18" fill="#17352f" font-weight="400">有错就发纠偏提示</text><rect x="692" y="315" width="272" height="145" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="712" y="353" font-size="23" fill="#126b53" font-weight="700">04 保存文件</text><text x="712" y="393" font-size="18" fill="#17352f" font-weight="400">复制回答到保存工具</text><text x="712" y="424" font-size="18" fill="#17352f" font-weight="400">选文件名，下载到 docs</text><rect x="364" y="315" width="272" height="145" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="384" y="353" font-size="23" fill="#126b53" font-weight="700">05 交给下一轮</text><text x="384" y="393" font-size="18" fill="#17352f" font-weight="400">重新打开刚保存的文件</text><text x="384" y="424" font-size="18" fill="#17352f" font-weight="400">复制全文发给 AI</text><path d="M312 190 L354 190" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M640 190 L682 190" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M828 270 L828 305" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M684 387 L647 387" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="42" y="365" font-size="22" fill="#17352f" font-weight="600">每次都能找到一个文件，</text><text x="42" y="398" font-size="22" fill="#17352f" font-weight="600">才算完成这一步。</text><text x="36" y="518" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>