<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1610" viewBox="0 0 1280 1610" role="img" aria-labelledby="title desc">
<title id="title">关闭事件的完整门槛</title><desc id="desc">合法请求先经过身份权限和版本检查，再检查处理中、至少一条处置记录、本地演练已有效恢复、服务端核实通过且时间有效、关闭结论非空；满足全部条件才能提交关闭与时间线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1610" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 09-02 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">关闭事件的完整门槛</text>
<g data-card="true"><rect x="64" y="190" width="1152" height="120" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">先确认请求与身份</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">字段白名单、非负整数 expectedVersion、非空结论；可信当前身份。</text></g><path d="M640 310 L640 370" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="370" width="1152" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="412" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">事务内锁定当前事件，并检查权限和版本</text><text x="88" y="452" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">事件必须存在；ADMIN 或本人范围内的处理者；expectedVersion 匹配。</text></g><path d="M640 490 L640 550" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="64" y="582" font-size="27" font-weight="600" fill="#17334b" text-anchor="start">关闭必须同时满足下列三组业务条件：</text><g data-card="true"><rect x="64" y="620" width="1152" height="120" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="662" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">1　处置条件</text><text x="88" y="702" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">state = IN_PROGRESS；时间线至少已有一条 NOTE。</text></g><g data-card="true"><rect x="64" y="774" width="1152" height="188" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="816" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">2　本地演练确已有效恢复</text><text x="88" y="856" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">sourceType=DEMO；sourceScope=LOCAL_DEMO；sourceState=RECOVERED。</text><text x="88" y="890" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">sourceRawStatus=DEMO_RECOVERED；sourceRecoveredAt 非空。</text><text x="88" y="924" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">恢复时间不早于 occurredAt；来源恢复本身不自动关闭。</text></g><g data-card="true"><rect x="64" y="996" width="1152" height="154" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="1038" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">3　服务端独立核实通过</text><text x="88" y="1078" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">sourceCheckOutcome=PASS；sourceVerifiedAt 非空且不早于恢复时间。</text><text x="88" y="1112" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">核实结论与时间由后端决定，不接受前端自报 PASS。</text></g><path d="M640 1150 L640 1210" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="1210" width="1152" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="1252" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">全部满足：关闭主记录，并追加 CLOSE 时间线</text><text x="88" y="1292" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">同一事务提交；任一写入失败须整体回滚。</text></g><rect x="64" y="1380" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="1416" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">任一适用检查失败即拒绝：400 格式，401 身份，403 权限，404 不存在。</text><text x="84" y="1450" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">版本不符返回 409 VERSION_CONFLICT；关闭门槛不符返回 409 STATE_CONFLICT。</text>
<line x1="48" y1="1542" x2="1232" y2="1542" stroke="#cfdae2"/>
<text x="48" y="1578" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
