<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="996" viewBox="0 0 1280 996" role="img" aria-labelledby="title desc">
<title id="title">时间线失败时主记录一同回滚</title><desc id="desc">先记录主行和历史基线，业务事务锁行并更新主行，时间线插入发生测试注入失败，异常触发回滚；请求结束后独立连接读取，与基线比较字段、版本和历史均未变。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="996" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 11-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">时间线失败时主记录一同回滚</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　记录基线</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">事件或责任的主字段、版本、历史</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　业务事务锁行</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">更新主记录；此时尚未提交</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　经过真实时间线写入路径</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">在提交前注入可识别的失败</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　异常传到事务边界</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">整体回滚，请求以非成功结束</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　用独立新连接回读</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">业务事务结束后、测试清理之前</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　比较基线与回读</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">主字段、版本、历史应全部不变</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="784" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="820" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">相等 → 关闭注入，再做正常请求共同提交的正向对照。</text><text x="84" y="854" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不相等 → 记录部分提交缺陷。事件与责任分别执行，不能用 mock 替代。</text>
<line x1="48" y1="928" x2="1232" y2="928" stroke="#cfdae2"/>
<text x="48" y="964" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>