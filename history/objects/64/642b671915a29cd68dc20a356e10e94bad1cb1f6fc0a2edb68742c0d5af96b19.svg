<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">每一种测试回答不同的问题</title><desc id="desc">不要把“构建成功”填写成“所有业务已验收”，也不要把教师报告写成本人执行。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="510" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">每一种测试回答不同的问题</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">不要把“构建成功”填写成“所有业务已验收”，也不要把教师报告写成本人执行。</text><rect x="36" y="128" width="928" height="68" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="55" y="170" font-size="20" fill="#126b53" font-weight="700">函数测试</text><text x="245" y="170" font-size="18" fill="#17352f" font-weight="400">给定输入 → 比较输出</text><text x="575" y="170" font-size="18" fill="#17352f" font-weight="400">能说明小规则是否符合预期</text><rect x="36" y="211" width="928" height="68" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="55" y="253" font-size="20" fill="#126b53" font-weight="700">浏览器与接口</text><text x="245" y="253" font-size="18" fill="#17352f" font-weight="400">实际点击 → 检查响应/页面</text><text x="575" y="253" font-size="18" fill="#17352f" font-weight="400">能说明本次页面链路发生了什么</text><rect x="36" y="294" width="928" height="68" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="55" y="336" font-size="20" fill="#126b53" font-weight="700">真实数据库测试</text><text x="245" y="336" font-size="18" fill="#17352f" font-weight="400">同版本竞争 / 注入故障</text><text x="575" y="336" font-size="18" fill="#17352f" font-weight="400">看版本、时间线与独立回读</text><rect x="36" y="377" width="928" height="68" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="55" y="419" font-size="20" fill="#126b53" font-weight="700">同伴解压复现</text><text x="245" y="419" font-size="18" fill="#17352f" font-weight="400">另一目录/机器 → 按README启动</text><text x="575" y="419" font-size="18" fill="#17352f" font-weight="400">能说明接手者能否完成关键路径</text><text x="36" y="488" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>