spring.application.name=campus-course
spring.config.import=optional:file:../.env[.properties]
server.address=127.0.0.1
server.port=8098
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:23501/campus_course?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:campus}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:23502}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s
campus.demo-password=${DEMO_PASSWORD}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
