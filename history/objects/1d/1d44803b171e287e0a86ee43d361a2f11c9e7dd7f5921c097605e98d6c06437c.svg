<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">代码回退与数据恢复的不同条件</title><desc id="desc">变更失败后先保存证据并判断是否改变数据结构或数据；代码问题在兼容性确认后恢复旧代码并回归，数据恢复则需要受审查的备份与隔离恢复流程，不能直接清库覆盖。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1160" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 12-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">代码回退与数据恢复的不同条件</text>
<g data-card="true"><rect x="64" y="190" width="1152" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">变更失败：先保存现状与证据</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">判断是否涉及数据或 schema；不确定时按需要审查的路径处理。</text></g><path d="M640 310 L640 350 L314 350 L314 410" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="314" y="385" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">仅代码行为</text><path d="M640 350 L966 350 L966 410" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="966" y="385" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">涉及数据或无法判断</text><g data-card="true"><rect x="64" y="410" width="500" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="452" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">核对兼容性</text><text x="88" y="492" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">确认旧代码与当前数据可兼容</text><text x="88" y="526" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">未确认时保留现状并请教师审查</text></g><g data-card="true"><rect x="716" y="410" width="500" height="160" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="740" y="452" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">教师审查恢复方案</text><text x="740" y="492" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">明确范围、备份与新增迁移</text><text x="740" y="526" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">核对新记录和其他数据的影响</text></g><path d="M564 490 L716 490" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="472" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">不兼容</text><path d="M314 570 L314 650" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="416" y="618" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">已确认兼容</text><path d="M966 570 L966 650" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1050" y="618" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">方案明确</text><g data-card="true"><rect x="64" y="650" width="500" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="692" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">在隔离副本恢复基线 A 代码</text><text x="88" y="732" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">当前数据不会被代码回退自动还原</text><text x="88" y="766" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">继续运行受影响检查</text></g><g data-card="true"><rect x="716" y="650" width="500" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="692" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">先做隔离恢复验证</text><text x="740" y="732" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">核对数据与后续记录影响</text><text x="740" y="766" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">确认恢复结果并运行受影响检查</text></g><path d="M314 810 L314 865 L640 865 L640 920" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 810 L966 865 L640 865" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="920" width="1152" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="962" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">记录实际结果与交接</text><text x="88" y="1002" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">代码回退与数据恢复是不同操作，禁止直接清库覆盖来掩盖问题。</text></g>
<line x1="48" y1="1092" x2="1232" y2="1092" stroke="#cfdae2"/>
<text x="48" y="1128" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
