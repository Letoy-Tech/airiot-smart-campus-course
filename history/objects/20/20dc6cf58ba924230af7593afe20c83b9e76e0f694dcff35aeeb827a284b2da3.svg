<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
<title id="title">工作区、暂存区与提交</title><desc id="desc">工作区经 git add 进入暂存区，经 git commit 形成提交；两种 diff 检查不同边界，已提交错误可通过新修正提交保留历史。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="920" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 04-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">工作区、暂存区与提交</text>
<g data-card="true"><rect x="64" y="240" width="336" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="282" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">工作区</text><text x="88" y="322" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">正在编辑的文件</text></g><g data-card="true"><rect x="472" y="240" width="336" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="496" y="282" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">暂存区</text><text x="496" y="322" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">准备提交的内容</text></g><g data-card="true"><rect x="880" y="240" width="336" height="160" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="904" y="282" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">提交</text><text x="904" y="322" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">已记录的版本快照</text></g><path d="M400 320 L472 320" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="436" y="220" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">git add</text><path d="M808 320 L880 320" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="844" y="220" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">git commit</text><path d="M232 400 L232 500 L640 500 L640 400" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="436" y="482" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">git diff：工作区与暂存区</text><path d="M640 400 L640 610 L1048 610 L1048 400" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="844" y="650" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">git diff --cached：暂存区与当前提交</text><rect x="64" y="705" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="741" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">普通 git diff 为空，不代表没有已暂存的改动。</text><text x="84" y="775" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">已提交的问题通过追加修正记录处理；保留可解释的历史。</text>
<line x1="48" y1="852" x2="1232" y2="852" stroke="#cfdae2"/>
<text x="48" y="888" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>