<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">从含糊要求到可检查的小任务</title><desc id="desc">含糊提示只有“完整、专业”，输出范围无法判断；明确提示包含目标、输入、规则、边界和验收，可逐项核对模型建议。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="950" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 01-02 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">从含糊要求到可检查的小任务</text>
<text x="64" y="164" font-size="23" font-weight="400" fill="#526b7c" text-anchor="start">先比较输入，再判断模型建议能否被检查。</text><text x="64" y="216" font-size="28" font-weight="600" fill="#17334b" text-anchor="start">信息不足的提示</text><g data-card="true"><rect x="64" y="250" width="544" height="156" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="88" y="292" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">含糊要求</text><text x="88" y="332" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">“完整系统”“专业一点”</text><text x="88" y="366" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">“不要出错”</text></g><path d="M336 406 L336 460" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="460" width="544" height="156" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="88" y="502" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">缺少共同边界</text><text x="88" y="542" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">角色和范围没有定义</text><text x="88" y="576" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">输入、规则与验收不清楚</text></g><path d="M336 616 L336 670" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="670" width="544" height="156" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="88" y="712" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">无法逐项验收</text><text x="88" y="752" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">回答很长，也难判断对错</text><text x="88" y="786" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">先补齐问题，再请求修改</text></g><text x="672" y="216" font-size="28" font-weight="600" fill="#17334b" text-anchor="start">可检查的小任务</text><g data-card="true"><rect x="672" y="250" width="544" height="156" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="696" y="292" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">给出目标和输入</text><text x="696" y="332" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">目标：设备台账需求</text><text x="696" y="366" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">输入：通信三态字段</text></g><path d="M944 406 L944 460" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="672" y="460" width="544" height="156" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="696" y="502" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">写明规则和边界</text><text x="696" y="542" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">未知不等于离线</text><text x="696" y="576" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">本次不做远端控制</text></g><path d="M944 616 L944 670" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="672" y="670" width="544" height="156" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="696" y="712" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">规定可观察验收</text><text x="696" y="752" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">true / false / null 分别检查</text><text x="696" y="786" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">逐项核对模型建议</text></g>
<line x1="48" y1="882" x2="1232" y2="882" stroke="#cfdae2"/>
<text x="48" y="918" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
