<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
<title id="title">从责任时间线解释当前分工</title><desc id="desc">初始责任为空且版本为零；第一条历史记录管理员将空责任改为 A 并附原因；第二条记录将 A 改为 B。当前责任显示 B，但旧历史继续保留前后 uid、操作者、说明与各自版本。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="880" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 10-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">从责任时间线解释当前分工</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">初始责任 · version=0</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">ownerUid=null</text><text x="88" y="306" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">尚无责任变更历史</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">第一条历史 · version=1</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">null → manager-a</text><text x="740" y="306" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">actor=ADMIN；说明：本轮分工</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="248" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">登记 A</text><g data-card="true"><rect x="716" y="430" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">第二条历史 · version=2</text><text x="740" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">manager-a → manager-b</text><text x="740" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">actor=ADMIN；说明：轮值调整</text></g><path d="M966 340 L966 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1030" y="394" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">改为 B</text><g data-card="true"><rect x="64" y="430" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">当前主记录 · version=2</text><text x="88" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">ownerUid=manager-b</text><text x="88" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">从最后一次合法变更解释当前分工</text></g><path d="M716 505 L564 505" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="488" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">对应</text><rect x="64" y="650" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="686" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">历史 v1 与 v2 均保留：前后 uid、当次操作者、时间和说明可追溯。</text><text x="84" y="720" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">显示名可以改变；不能用新显示名覆盖已经保存的历史 uid。</text>
<line x1="48" y1="812" x2="1232" y2="812" stroke="#cfdae2"/>
<text x="48" y="848" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
