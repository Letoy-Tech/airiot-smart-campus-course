<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1162" viewBox="0 0 1280 1162" role="img" aria-labelledby="title desc">
<title id="title">从失败证据到最小修复与回归</title><desc id="desc">保存失败，固定最小复现，从事实形成假设并补观察，定位后进行最小修改，再运行原失败与相邻回归；若未解释失败则继续定位，解释成立后记录缺陷关闭证据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1162" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 11-04 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">从失败证据到最小修复与回归</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　保存首次失败</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">留下输入、版本和实际结果</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　固定最小复现</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">减少同时变化的条件</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　区分事实与假设</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">把证据缺口单独列出</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　增加最少观察点</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">用观察支持或推翻假设</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　定位并解释现象</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">没有解释清楚时继续定位</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　进行最小修复</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不放宽权限，不删断言</text></g><g data-card="true"><rect x="716" y="790" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="832" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">07　重跑原失败与相邻回归</text><text x="740" y="872" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">比较实际结果与独立规则</text></g><g data-card="true"><rect x="64" y="790" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="832" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">08　记录结果并交接</text><text x="88" y="872" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">保留差异、证据与未覆盖项</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640.0" y="648" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">已定位</text><path d="M966 740 L966 790" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 865 L564 865" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640.0" y="848" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">符合规则</text><rect x="64" y="984" width="1152" height="72" rx="8" fill="#fff5df"/><text x="84" y="1020" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">未定位 → 回到事实、假设和观察；回归不符 → 保留失败继续定位。</text>
<line x1="48" y1="1094" x2="1232" y2="1094" stroke="#cfdae2"/>
<text x="48" y="1130" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>