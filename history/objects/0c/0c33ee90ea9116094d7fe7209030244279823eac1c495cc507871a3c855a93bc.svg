<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1340" viewBox="0 0 1280 1340" role="img" aria-labelledby="title desc">
<title id="title">授权与拒绝路径</title><desc id="desc">无有效身份的请求返回 401；角色或适用对象范围不符返回 403；授权通过后仍检查参数和业务条件，只有全部满足才执行操作。被拒绝的写请求不得产生业务记录。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1340" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 08-02 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">授权与拒绝路径</text>
<g data-card="true"><rect x="64" y="190" width="620" height="140" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">身份有效？</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">当前请求有可信的教学身份</text></g><g data-card="true"><rect x="836" y="190" width="380" height="140" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="860" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">401 身份无效</text><text x="860" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按合同拒绝，不写业务记录</text></g><path d="M684 260 L836 260" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="242" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">否</text><path d="M374 330 L374 380" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="414" y="366" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">是</text><g data-card="true"><rect x="64" y="380" width="620" height="140" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="422" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">角色有资格？</text><text x="88" y="462" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">读取、管理、处置按合同区分</text></g><g data-card="true"><rect x="836" y="380" width="380" height="140" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="860" y="422" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">403 权限不足</text><text x="860" y="462" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按合同拒绝，不写业务记录</text></g><path d="M684 450 L836 450" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="432" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">否</text><path d="M374 520 L374 570" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="414" y="556" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">是</text><g data-card="true"><rect x="64" y="570" width="620" height="140" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="612" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">对象在范围内？</text><text x="88" y="652" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">管理人员只能处理本人已分派事件</text></g><g data-card="true"><rect x="836" y="570" width="380" height="140" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="860" y="612" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">403 对象范围不足</text><text x="860" y="652" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按合同拒绝，不写业务记录</text></g><path d="M684 640 L836 640" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="622" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">否</text><path d="M374 710 L374 760" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="414" y="746" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">是</text><g data-card="true"><rect x="64" y="760" width="620" height="140" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="802" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">参数、对象与业务有效？</text><text x="88" y="842" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">仍须满足字段、存在性、状态和版本规则</text></g><g data-card="true"><rect x="836" y="760" width="380" height="140" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="860" y="802" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">400 / 404 / 409</text><text x="860" y="842" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按合同拒绝，不写业务记录</text></g><path d="M684 830 L836 830" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="760" y="812" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">否</text><g data-card="true"><rect x="64" y="990" width="1152" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="1032" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">全部适用条件满足后执行</text><text x="88" y="1072" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">返回服务端事实；前端入口只接受 Boolean true 授权。</text></g><path d="M374 900 L374 990" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="414" y="950" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">是</text><rect x="64" y="1160" width="1152" height="72" rx="8" fill="#f3f6f9"/><text x="84" y="1196" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">图示为业务判断关系；实际认证与参数校验入口沿教师冻结的基础实现。</text>
<line x1="48" y1="1272" x2="1232" y2="1272" stroke="#cfdae2"/>
<text x="48" y="1308" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>