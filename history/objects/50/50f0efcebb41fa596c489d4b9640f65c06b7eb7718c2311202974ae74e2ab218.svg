<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="996" viewBox="0 0 1280 996" role="img" aria-labelledby="title desc">
<title id="title">小变更的影响分析与验证流程</title><desc id="desc">接收筛选需求后写验收条件，核对现有合同与影响范围，保存基线，再修改页面与测试；通过受影响检查和浏览器验证后更新交付说明，失败则保留证据继续修复。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="996" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 12-02 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">小变更的影响分析与验证流程</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　定义状态筛选需求</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">刷新后仍保留；写可观察验收</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　核对合同和影响范围</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">复用已有 state 参数与业务规则</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　保存基线 A</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">保留原有代码和证据</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　实施最小变更</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">页面、参数与对应测试一起调整</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　运行受影响检查</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">类型、刷新、清除、切换与失败</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　形成基线 B 并交接</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">更新说明和变更记录；同伴复现</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640.0" y="648" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">符合规则</text><rect x="64" y="784" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="820" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">检查失败 → 保留证据，定位后回到最小修改；不可把失败写成通过。</text><text x="84" y="854" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">确需修改合同或 schema → 先统一约定、测试及迁移审查。</text>
<line x1="48" y1="928" x2="1232" y2="928" stroke="#cfdae2"/>
<text x="48" y="964" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
