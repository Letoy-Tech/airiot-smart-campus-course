<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="996" viewBox="0 0 1280 996" role="img" aria-labelledby="title desc">
<title id="title">网页 AI 协作中的人工证据闭环</title><desc id="desc">学生提供目标和合同，网页 AI 给建议，学生审查并应用，再在本地核验；不符时回传证据，符合时记录结果并交接。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="996" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 01-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">网页 AI 协作中的人工证据闭环</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　学生定义任务</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">提供目标、合同和必要片段</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　网页 AI 提出建议</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">给出方案、草稿与解释</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　学生审查</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">采纳或拒绝，核对业务规则</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　学生本地执行</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">人工应用修改并运行核验</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　比较预期与实际</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">判断结果是否满足验收</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　记录证据并接力</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">只记录实际结果与未决项</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640.0" y="648" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">通过</text><rect x="64" y="784" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="820" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">审查发现规则冲突 → 明确反馈给网页 AI；不直接执行。</text><text x="84" y="854" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">实际不符或证据不足 → 回传真实、脱敏证据，再审查与核验。</text>
<line x1="48" y1="928" x2="1232" y2="928" stroke="#cfdae2"/>
<text x="48" y="964" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
