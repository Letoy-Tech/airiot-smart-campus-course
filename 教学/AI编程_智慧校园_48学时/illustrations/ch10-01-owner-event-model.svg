<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1150" viewBox="0 0 1280 1150" role="img" aria-labelledby="title desc">
<title id="title">当前责任、责任历史与事件的关系</title><desc id="desc">设备关联一条当前责任记录，责任记录对应多条责任变更历史；事件创建时读取责任作为分派依据，之后保存独立负责人，事件再对应自己的动作时间线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1150" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 10-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">当前责任、责任历史与事件的关系</text>
<g data-card="true"><rect x="350" y="190" width="580" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="374" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">教学设备的逻辑引用</text><text x="374" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">用 deviceId 关联责任与事件</text></g><path d="M640 310 L640 360 L314 360 L314 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 360 L966 360 L966 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="64" y="430" width="500" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">当前责任主记录</text><text x="88" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">ownerUid / version</text><text x="88" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">登记当前设备责任人</text></g><g data-card="true"><rect x="716" y="430" width="500" height="160" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">独立事件主记录</text><text x="740" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">assigneeUid / state / version</text><text x="740" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">创建时保存本事件的负责人</text></g><path d="M314 590 L314 710" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="440" y="665" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">同一责任事务追加</text><path d="M966 590 L966 710" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1092" y="665" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">同一事件事务追加</text><g data-card="true"><rect x="64" y="710" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="752" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">责任时间线</text><text x="88" y="792" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">前后 uid、操作者、说明与版本</text><text x="88" y="826" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">保留每次责任变更</text></g><g data-card="true"><rect x="716" y="710" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="752" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">事件时间线</text><text x="740" y="792" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">action / actor / caseVersion</text><text x="740" y="826" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">保留每次事件业务动作</text></g><rect x="64" y="920" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="956" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">创建新事件时才读取当前责任，并重新核对责任人的处理资格。</text><text x="84" y="990" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">责任更新不改已有事件；已有事件的负责人只经显式 assign 改派。</text>
<line x1="48" y1="1082" x2="1232" y2="1082" stroke="#cfdae2"/>
<text x="48" y="1118" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
