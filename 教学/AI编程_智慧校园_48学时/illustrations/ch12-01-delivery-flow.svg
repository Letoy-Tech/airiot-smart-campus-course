<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1196" viewBox="0 0 1280 1196" role="img" aria-labelledby="title desc">
<title id="title">从源码基线到可复现业务交付</title><desc id="desc">确认源码与依赖基线后执行检查构建，取得带标识的产物；在独立环境启动，再用真实身份验证业务；同伴根据说明复现并提交问题记录，形成可交接包。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1196" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 12-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">从源码基线到可复现业务交付</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　确认源码基线</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">锁文件、迁移与种子版本</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　执行检查和构建</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">保存实际命令与退出结果</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　标识构建产物</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">记录位置、版本或哈希</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　在独立环境运行</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">核对地址、配置与进程</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　验证真实身份的业务</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">四身份与核心流程分别留证据</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　同伴按说明干净复现</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">记录问题和实际覆盖范围</text></g><g data-card="true"><rect x="716" y="790" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="832" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">07　形成交付包与交接</text><text x="740" y="872" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">证据索引、版本和剩余缺口</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 740 L966 790" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="984" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="1020" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">构建成功不等于业务通过；启动成功不等于他人可复现。</text><text x="84" y="1054" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">每一步保存自己的结果，未完成项目继续列为缺口。</text>
<line x1="48" y1="1128" x2="1232" y2="1128" stroke="#cfdae2"/>
<text x="48" y="1164" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
