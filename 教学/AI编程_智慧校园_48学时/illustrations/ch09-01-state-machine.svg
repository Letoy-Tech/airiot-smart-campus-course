<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170" role="img" aria-labelledby="title desc">
<title id="title">事件处置状态与合法迁移</title><desc id="desc">事件创建后按责任人有效性进入待分派或待处理；分派进入待处理，开始进入处理中，重新分派回到待处理，满足全部门槛后关闭，关闭后禁止修改。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1170" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 09-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">事件处置状态与合法迁移</text>
<g data-card="true"><rect x="64" y="200" width="480" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="242" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">NEW　待分派</text><text x="88" y="282" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">当前没有有效事件负责人</text></g><g data-card="true"><rect x="716" y="200" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="242" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">创建独立演练事件</text><text x="740" y="282" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">有效责任人可成为初始 assignee</text><text x="740" y="316" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">创建版本为 1，保留来源标记</text></g><path d="M716 275 L544 275" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="630" y="252" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">无有效责任人</text><g data-card="true"><rect x="64" y="440" width="480" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="482" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">ASSIGNED　待处理</text><text x="88" y="522" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">已保存负责人，等待明确开始</text></g><path d="M304 350 L304 440" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="390" y="403" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">ADMIN 分派</text><path d="M966 350 L966 395 L544 395 L544 440" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="810" y="384" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">有有效责任人</text><g data-card="true"><rect x="716" y="440" width="500" height="150" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="740" y="482" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">来源状态另存</text><text x="740" y="522" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">ACTIVE / RECOVERED / UNKNOWN</text><text x="740" y="556" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">来源恢复不自动关闭</text></g><g data-card="true"><rect x="64" y="700" width="480" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="742" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">IN_PROGRESS　处理中</text><text x="88" y="782" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">可追加处置 NOTE</text><text x="88" y="816" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按规则核实来源并请求关闭</text></g><path d="M304 590 L304 700" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="420" y="653" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">有权处理者开始</text><path d="M544 775 L608 775 L608 515 L544 515" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="706" y="642" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">ADMIN 重新分派</text><g data-card="true"><rect x="716" y="700" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="742" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">CLOSED　已关闭</text><text x="740" y="782" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">全部关闭门槛满足</text><text x="740" y="816" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">后续修改均禁止，包括重复恢复</text></g><path d="M544 835 L650 835 L650 775 L716 775" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="820" y="884" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">全部门槛通过</text><rect x="64" y="940" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="976" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">ASSIGNED 可由 ADMIN 重新分派；IN_PROGRESS 追加 NOTE 时状态不变。</text><text x="84" y="1010" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">恢复与核实不自动推进处置状态；各动作仍检查权限、版本和适用条件。</text>
<line x1="48" y1="1102" x2="1232" y2="1102" stroke="#cfdae2"/>
<text x="48" y="1138" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>
