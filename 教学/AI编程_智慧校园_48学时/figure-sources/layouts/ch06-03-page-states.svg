<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">页面数据状态与反馈</title><desc id="desc">首次读取进入加载，成功后区分原始空目录、筛选无匹配和正常列表；首次失败展示错误，已有结果的再次读取失败保留带说明的旧快照。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="950" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 06-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">页面数据状态与反馈</text>
<g data-card="true"><rect x="350" y="190" width="580" height="130" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="374" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">读取页面数据</text><text x="374" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">先区分首次加载和已有成功快照</text></g><text x="64" y="376" font-size="25" font-weight="600" fill="#17334b" text-anchor="start">首次读取结束后，按真实结果选择对应反馈：</text><g data-card="true"><rect x="64" y="430" width="264" height="220" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="88" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">首次失败</text><text x="88" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">显示安全错误</text><text x="88" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">提供重试</text><text x="88" y="580" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不显示假数据</text></g><path d="M640 320 L640 397 L196 397 L196 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="360" y="430" width="264" height="220" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="384" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">原始目录为空</text><text x="384" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">请求成功</text><text x="384" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">原始列表为 []</text><text x="384" y="580" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">显示“目录为空”</text></g><path d="M640 320 L640 397 L492 397 L492 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="656" y="430" width="264" height="220" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="680" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">筛选无匹配</text><text x="680" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">原始目录有数据</text><text x="680" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">筛选后为空</text><text x="680" y="580" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">提供清除筛选</text></g><path d="M640 320 L640 397 L788 397 L788 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="true"><rect x="952" y="430" width="264" height="220" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="976" y="472" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">有匹配结果</text><text x="976" y="512" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">显示列表 / 卡片</text><text x="976" y="546" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">数量来自实际结果</text><text x="976" y="580" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">按标识进入详情</text></g><path d="M640 320 L640 397 L1084 397 L1084 430" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="720" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="756" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">已有成功快照的再次读取失败：保留旧快照，并标明失败与最后成功时间。</text><text x="84" y="790" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">重试 / 下一轮成功：重新依据原始列表与筛选结果分类，不保留假成功状态。</text>
<line x1="48" y1="882" x2="1232" y2="882" stroke="#cfdae2"/>
<text x="48" y="918" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>