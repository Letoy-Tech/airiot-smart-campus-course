<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img" aria-labelledby="title desc">
<title id="title">测试证据的层级与证明范围</title><desc id="desc">需求规则分别连接构建与单元、真实数据库、带身份 API、浏览器流程及选做外部接入；每类证据只支持其覆盖范围，不能用 mock 证明锁或事务，也不能用构建代替浏览器验收。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1070" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 11-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">测试证据的层级与证明范围</text>
<text x="64" y="170" font-size="25" font-weight="600" fill="#17334b" text-anchor="start">五类证据并列回答不同问题，不能互相替代。</text><g data-card="true"><rect x="64" y="230" width="500" height="156" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="272" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">构建与单元</text><text x="88" y="312" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">类型、纯规则与组件分支</text><text x="88" y="346" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不能证明真实事务或完整页面</text></g><g data-card="true"><rect x="716" y="230" width="500" height="156" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="272" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">真实 MySQL 集成</text><text x="740" y="312" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">行锁、版本、唯一约束与回滚</text><text x="740" y="346" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">必须观察实际数据库边界</text></g><g data-card="true"><rect x="64" y="440" width="500" height="156" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="482" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">带身份 API</text><text x="88" y="522" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">角色、对象范围与字段校验</text><text x="88" y="556" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">请求、响应和独立回读对应</text></g><g data-card="true"><rect x="716" y="440" width="500" height="156" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="482" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">浏览器流程</text><text x="740" y="522" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">输入保留、状态提示与刷新</text><text x="740" y="556" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不能单独证明数据库原子性</text></g><g data-card="true"><rect x="64" y="650" width="500" height="156" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="88" y="692" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">选做外部接入</text><text x="88" y="732" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">只读路径与实际来源单独验证</text><text x="88" y="766" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">基础课程不依赖真实平台</text></g><g data-card="true"><rect x="716" y="650" width="500" height="156" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="692" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">统一报告方式</text><text x="740" y="732" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">每类写明版本、范围、实际结果</text><text x="740" y="766" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">未验证内容继续作为缺口</text></g><rect x="64" y="880" width="1152" height="72" rx="8" fill="#fff5df"/><text x="84" y="916" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">Mock 不证明真实行锁与回滚；构建成功不代表浏览器流程通过。</text>
<line x1="48" y1="1002" x2="1232" y2="1002" stroke="#cfdae2"/>
<text x="48" y="1038" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>