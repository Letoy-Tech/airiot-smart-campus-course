<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1230" viewBox="0 0 1280 1230" role="img" aria-labelledby="title desc">
<title id="title">首次贯通的分层定位路径</title><desc id="desc">先检查 Network 是否有请求；无请求看前端事件，有请求则区分 HTML、身份权限拒绝、服务错误与合法 JSON；最后分别检查代理、登录授权、后端日志或页面解析。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1230" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 04-03 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">首次贯通的分层定位路径</text>
<g data-card="true"><rect x="64" y="190" width="500" height="140" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">页面没有预期设备</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">先观察 Network 是否有请求</text></g><g data-card="true"><rect x="716" y="190" width="500" height="140" rx="10" fill="#fff5df" stroke="#b58429" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">没有请求</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">检查前端事件、加载逻辑</text><text x="740" y="306" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">以及控制台错误</text></g><path d="M564 260 L716 260" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="640" y="244" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">没有</text><g data-card="true"><rect x="64" y="410" width="500" height="120" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="88" y="452" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">有请求：检查实际响应</text><text x="88" y="492" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">先看状态、类型和响应正文</text></g><path d="M314 330 L314 410" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="375" font-size="21" font-weight="400" fill="#526b7c" text-anchor="middle">有</text><g data-card="true"><rect x="64" y="640" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="682" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">HTML / 路径不匹配</text><text x="88" y="722" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">代理前缀与路径重写</text><text x="88" y="756" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">目标地址与页面回退</text></g><g data-card="true"><rect x="716" y="640" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="682" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">401 / 403</text><text x="740" y="722" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">教学登录身份和权限</text><text x="740" y="756" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">不要用绕过认证来调试</text></g><g data-card="true"><rect x="64" y="850" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="892" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">网络 / 服务错误</text><text x="88" y="932" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">后端日志与监听端口</text><text x="88" y="966" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">再看依赖和数据源</text></g><g data-card="true"><rect x="716" y="850" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="892" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">合法成功 JSON</text><text x="740" y="932" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">data.items 的取值层级</text><text x="740" y="966" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">字段类型和页面渲染</text></g><path d="M564 470 L640 470 L640 590 L314 590 L314 640" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 590 L966 590 L966 640" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 590 L640 800 L314 800 L314 850" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640 800 L966 800 L966 850" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="1050" width="1152" height="72" rx="8" fill="#f3f6f9"/><text x="84" y="1086" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">四个响应分支并列；只检查与观察现象对应的层次。</text>
<line x1="48" y1="1162" x2="1232" y2="1162" stroke="#cfdae2"/>
<text x="48" y="1198" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>