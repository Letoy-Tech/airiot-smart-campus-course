<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="996" viewBox="0 0 1280 996" role="img" aria-labelledby="title desc">
<title id="title">从使用问题到可交接证据</title><desc id="desc">使用问题依次进入需求、设计、实现、验证和交付；验证发现偏差后回到需求或设计，交付后的新问题开始下一轮。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#526b7c"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="996" fill="white"/>
<rect x="48" y="38" width="5" height="64" rx="2" fill="#245b81"/>
<text x="72" y="53" font-size="17" font-weight="400" fill="#526b7c" text-anchor="start">图 01-01 · 教学示意</text><text x="72" y="98" font-size="32" font-weight="600" fill="#17334b" text-anchor="start">从使用问题到可交接证据</text>
<g data-card="true"><rect x="64" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">01　使用问题</text><text x="88" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">先明确谁遇到了什么问题</text></g><g data-card="true"><rect x="716" y="190" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="232" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">02　需求</text><text x="740" y="272" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">用户故事与可观察验收</text></g><g data-card="true"><rect x="716" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="740" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">03　设计</text><text x="740" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">数据模型与接口合同</text></g><g data-card="true"><rect x="64" y="390" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="432" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">04　实现</text><text x="88" y="472" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">在允许范围内完成局部代码</text></g><g data-card="true"><rect x="64" y="590" width="500" height="150" rx="10" fill="#edf4fb" stroke="#487ca4" stroke-width="2"/><text x="88" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">05　验证</text><text x="88" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">比较预期与实际结果</text></g><g data-card="true"><rect x="716" y="590" width="500" height="150" rx="10" fill="#edf7f4" stroke="#558c7e" stroke-width="2"/><text x="740" y="632" font-size="26" font-weight="600" fill="#17334b" text-anchor="start">06　交付</text><text x="740" y="672" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">记录版本、证据与接力</text></g><path d="M564 265 L716 265" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M966 340 L966 390" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M716 465 L564 465" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 540 L314 590" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M564 665 L716 665" fill="none" stroke="#526b7c" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="64" y="784" width="1152" height="106" rx="8" fill="#fff5df"/><text x="84" y="820" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">验证发现歧义 → 回到需求；发现设计缺口 → 回到设计。</text><text x="84" y="854" font-size="23" font-weight="400" fill="#17334b" text-anchor="start">交付后的新问题 → 开始下一轮，不抹去已有证据。</text>
<line x1="48" y1="928" x2="1232" y2="928" stroke="#cfdae2"/>
<text x="48" y="964" font-size="19" font-weight="400" fill="#526b7c" text-anchor="start">教学设计示意 · 非运行截图 · 不代表实验已验证</text>
</svg>