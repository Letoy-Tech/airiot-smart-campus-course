<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">时序图｜带版本的事件动作</title><desc id="desc">每个写动作独立执行；本图以 /cases/{id}/actions 为例，不把网络超时当作写入已回滚。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="1120" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">时序图｜带版本的事件动作</text><text x="36" y="77" class="subtitle" text-anchor="start">每个写动作独立执行；本图以 /cases/{id}/actions 为例，不把网络超时当作写入已回滚。</text><rect x="25" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="43" y="142" class="head" text-anchor="start">浏览器 / 数据层</text><path d="M125 177 V1005" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="315" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="333" y="142" class="head" text-anchor="start">控制器 + 会话检查</text><path d="M415 177 V1005" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="605" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="623" y="142" class="head" text-anchor="start">业务服务与规则</text><path d="M705 177 V1005" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="895" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="913" y="142" class="head" text-anchor="start">MySQL</text><path d="M995 177 V1005" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M125 235 H415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="222" class="small" text-anchor="middle">1. POST actions {action,expectedVersion,...}</text><path d="M415 295 H705" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560.0" y="282" class="small" text-anchor="middle">2. 已认证User + 校验后的请求</text><path d="M705 355 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850.0" y="342" class="small" text-anchor="middle">3. 开启事务；SELECT ... FOR UPDATE</text><path d="M995 415 H705" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="850.0" y="402" class="small" text-anchor="middle">4. 当前事件、状态与版本</text><path d="M705 515 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850.0" y="502" class="small" text-anchor="middle">5. 规则通过：更新主记录及timeline JSON</text><path d="M705 575 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="850.0" y="562" class="small" text-anchor="middle">6. 同事务 INSERT audit</text><path d="M995 635 H705" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="850.0" y="622" class="small" text-anchor="middle">7. 事务成功提交</text><path d="M705 695 H415" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="560.0" y="682" class="small" text-anchor="middle">8. 返回新版本与状态</text><path d="M415 755 H125" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270.0" y="742" class="small" text-anchor="middle">9. HTTP200 / code0 / CaseRecord</text><path d="M125 825 H415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="812" class="small" text-anchor="middle">10. 独立 GET /api/cases 回读</text><path d="M415 885 H125" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270.0" y="872" class="small" text-anchor="middle">11. 显示服务器保存的状态</text><rect x="36" y="945" width="1048" height="115" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="54" y="975" class="head" text-anchor="start">第4步后的规则检查与失败分支</text><text x="54" y="1005" class="small" text-anchor="start">依次检查角色、版本、未关闭状态，再检查动作条件；无权限403，冲突/错误状态409，非法内容400。</text><text x="54" y="1030" class="small" text-anchor="start">失败不执行成功写入；409先回读，由人重新决定，不自动重发；失联结果不明也先回读。</text><text x="36" y="1098" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.1 · 本地教学样本 / 可编辑 SVG</text></svg>