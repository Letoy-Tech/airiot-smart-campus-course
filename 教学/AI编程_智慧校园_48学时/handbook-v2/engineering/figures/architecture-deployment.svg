<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">分层部署图｜一台电脑上的协作</title><desc id="desc">所有网络入口绑定 127.0.0.1；箭头表示调用，数据保存位置单独注明。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="790" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">分层部署图｜一台电脑上的协作</text><text x="36" y="77" class="subtitle" text-anchor="start">所有网络入口绑定 127.0.0.1；箭头表示调用，数据保存位置单独注明。</text><rect x="35" y="125" width="300" height="180" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="53" y="155" class="head" text-anchor="start">浏览器 / frontend</text><text x="53" y="185" class="small" text-anchor="start">HTML、CSS、app.js</text><text x="53" y="210" class="small" text-anchor="start">data-service.js → 同源 /api</text><text x="53" y="235" class="small" text-anchor="start">令牌仅内存；演示数据localStorage</text><rect x="410" y="125" width="280" height="180" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="428" y="155" class="head" text-anchor="start">A：Node 页面服务</text><text x="428" y="185" class="small" text-anchor="start">127.0.0.1:5188</text><text x="428" y="210" class="small" text-anchor="start">只公开 frontend</text><text x="428" y="235" class="small" text-anchor="start">/api 原路径转发；不做业务授权</text><rect x="765" y="125" width="320" height="180" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="783" y="155" class="head" text-anchor="start">B：Spring Boot 后端</text><text x="783" y="185" class="small" text-anchor="start">127.0.0.1:8098</text><text x="783" y="210" class="small" text-anchor="start">拦截器 → 控制器 → 服务/规则</text><text x="783" y="235" class="small" text-anchor="start">JdbcTemplate；业务权限与事务</text><path d="M335 213 H410" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="352" y="199" class="small" text-anchor="start">HTTP</text><path d="M690 213 H765" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="710" y="199" class="small" text-anchor="start">/api</text><rect x="400" y="415" width="320" height="150" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="418" y="445" class="head" text-anchor="start">MySQL 8.4</text><text x="418" y="475" class="small" text-anchor="start">宿主23501 → 容器3306</text><text x="418" y="500" class="small" text-anchor="start">业务 / 用户摘要 / 审计</text><text x="418" y="525" class="small" text-anchor="start">命名卷：停止或重启后仍保存</text><rect x="765" y="415" width="320" height="150" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="783" y="445" class="head" text-anchor="start">Redis 7.4</text><text x="783" y="475" class="small" text-anchor="start">宿主23502 → 容器6379</text><text x="783" y="500" class="small" text-anchor="start">仅短时会话，TTL 1800秒</text><text x="783" y="525" class="small" text-anchor="start">本课无持久化；重启后重登</text><path d="M850 305 V355 H560 V415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="596" y="344" class="small" text-anchor="start">SQL / 事务</text><path d="M965 305 V415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="976" y="366" class="small" text-anchor="start">校验会话</text><rect x="35" y="415" width="300" height="150" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="53" y="445" class="head" text-anchor="start">C：工具终端</text><text x="53" y="475" class="small" text-anchor="start">Compose / 配置 / 检查</text><text x="53" y="500" class="small" text-anchor="start">命令结束可继续输入</text><text x="53" y="525" class="small" text-anchor="start">不是第三个常驻业务服务</text><rect x="35" y="620" width="1050" height="95" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="53" y="650" class="head" text-anchor="start">隔离与边界</text><text x="53" y="680" class="small" text-anchor="start">页面不直连数据库；不公开.env；不连接真实校园；端口冲突先确认自己的进程。</text><text x="36" y="768" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.2 · 本地教学样本 / 可编辑 SVG</text></svg>