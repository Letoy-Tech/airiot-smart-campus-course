<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="950" viewBox="0 0 1120 950" role="img" aria-labelledby="title desc"><title id="title">概念类图｜对象关系与代码职责</title><desc id="desc">上部是业务概念，不表示源码都有同名Java类；下部标明参考工程真实职责依赖。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="950" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">概念类图｜对象关系与代码职责</text><text x="36" y="77" class="subtitle" text-anchor="start">上部是业务概念，不表示源码都有同名Java类；下部标明参考工程真实职责依赖。</text><rect x="40" y="130" width="250" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="160" class="head" text-anchor="start">Space / 空间</text><text x="58" y="190" class="small" text-anchor="start">id, name</text><text x="58" y="215" class="small" text-anchor="start">building, floor</text><rect x="435" y="130" width="250" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="453" y="160" class="head" text-anchor="start">Device / 设备</text><text x="453" y="190" class="small" text-anchor="start">id, spaceId, category</text><text x="453" y="215" class="small" text-anchor="start">online, simulated</text><rect x="830" y="130" width="250" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="848" y="160" class="head" text-anchor="start">User / 账号</text><text x="848" y="190" class="small" text-anchor="start">username, role</text><text x="848" y="215" class="small" text-anchor="start">实际Java record</text><path d="M290 185 H435" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="328" y="172" class="small" text-anchor="start">1 — 0..N</text><rect x="40" y="355" width="250" height="130" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="385" class="head" text-anchor="start">Point / History</text><text x="58" y="415" class="small" text-anchor="start">deviceId + tagId</text><text x="58" y="440" class="small" text-anchor="start">value / samples</text><text x="58" y="465" class="small" text-anchor="start">概念关联，不表示相互FK</text><path d="M165 355 V290 H510 V240" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="195" y="279" class="small" text-anchor="start">0..N — 1</text><rect x="435" y="355" width="250" height="130" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="453" y="385" class="head" text-anchor="start">Owner / 责任</text><text x="453" y="415" class="small" text-anchor="start">deviceId, username</text><text x="453" y="440" class="small" text-anchor="start">note, version</text><text x="453" y="465" class="small" text-anchor="start">概念对象，响应使用Map</text><path d="M560 355 V240" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="576" y="298" class="small" text-anchor="start">0..1 — 1</text><path d="M685 415 H760 V185 H830" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="770" y="327" class="small" text-anchor="start">0..N — 1</text><rect x="830" y="355" width="250" height="130" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="848" y="385" class="head" text-anchor="start">CaseRecord / 事件</text><text x="848" y="415" class="small" text-anchor="start">state, assignee, version</text><text x="848" y="440" class="small" text-anchor="start">sourceState, verified</text><text x="848" y="465" class="small" text-anchor="start">timeline；实际Java类</text><path d="M955 355 V240" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="965" y="298" class="small" text-anchor="start">0..N — 0..1</text><path d="M890 355 V275 H650 V240" fill="none" stroke="#406b72" stroke-width="1.8"/><text x="704" y="264" class="small" text-anchor="start">事件0..N — 设备1</text><rect x="40" y="610" width="300" height="160" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="640" class="head" text-anchor="start">CampusController</text><text x="58" y="670" class="small" text-anchor="start">请求DTO与路径</text><text x="58" y="695" class="small" text-anchor="start">依赖 CampusService / AuthService</text><text x="58" y="720" class="small" text-anchor="start">调用入口，不保存页面状态</text><rect x="410" y="610" width="300" height="160" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="428" y="640" class="head" text-anchor="start">CampusService</text><text x="428" y="670" class="small" text-anchor="start">JdbcTemplate + ObjectMapper</text><text x="428" y="695" class="small" text-anchor="start">事务 / 查询 / 保存 / 审计</text><text x="428" y="720" class="small" text-anchor="start">调用 CaseRules.apply</text><rect x="780" y="610" width="300" height="160" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="798" y="640" class="head" text-anchor="start">CaseRules + User</text><text x="798" y="670" class="small" text-anchor="start">纯状态与权限规则</text><text x="798" y="695" class="small" text-anchor="start">操作 CaseRecord</text><text x="798" y="720" class="small" text-anchor="start">不直接连数据库</text><path d="M340 690 H410" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="349" y="675" class="small" text-anchor="start">调用</text><path d="M710 690 H780" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720" y="675" class="small" text-anchor="start">调用</text><text x="42" y="840" class="label" text-anchor="start">概念模型回答“有哪些对象及关系”；源码模型回答“哪些类承担这些职责”。</text><text x="42" y="872" class="label" text-anchor="start">参考Map/JSON的教学简化不等于数据库没有约束，实际约束以ER图和SQL为准。</text><text x="36" y="928" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.2 · 本地教学样本 / 可编辑 SVG</text></svg>