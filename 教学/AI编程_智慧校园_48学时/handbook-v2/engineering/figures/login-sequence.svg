<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1180" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc"><title id="title">时序图｜登录、受保护读取与退出</title><desc id="desc">浏览器的请求经A代理到B；图中为简洁起见将A转发折叠，口令/令牌不写入证据。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="1180" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">时序图｜登录、受保护读取与退出</text><text x="36" y="77" class="subtitle" text-anchor="start">浏览器的请求经A代理到B；图中为简洁起见将A转发折叠，口令/令牌不写入证据。</text><rect x="25" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="43" y="142" class="head" text-anchor="start">浏览器 / 数据层</text><path d="M125 177 V1065" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="315" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="333" y="142" class="head" text-anchor="start">后端认证服务</text><path d="M415 177 V1065" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="605" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="623" y="142" class="head" text-anchor="start">MySQL / 用户</text><path d="M705 177 V1065" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><rect x="895" y="112" width="200" height="65" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="913" y="142" class="head" text-anchor="start">Redis / 会话</text><path d="M995 177 V1065" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><path d="M125 235 H415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="222" class="small" text-anchor="middle">1. POST /api/login {username,password}</text><path d="M415 295 H705" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560.0" y="282" class="small" text-anchor="middle">2. 查询规范账号与BCrypt摘要</text><path d="M705 355 H415" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="560.0" y="342" class="small" text-anchor="middle">3. 用户记录；后端校验口令</text><path d="M415 425 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705.0" y="412" class="small" text-anchor="middle">4. 随机令牌 → 保存会话，TTL1800秒</text><path d="M995 495 H415" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="705.0" y="482" class="small" text-anchor="middle">5. 保存完成</text><path d="M415 565 H125" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270.0" y="552" class="small" text-anchor="middle">6. 200 {token,user}；令牌只存页面内存</text><path d="M125 635 H415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="622" class="small" text-anchor="middle">7. GET /api/me + Bearer令牌</text><path d="M415 695 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705.0" y="682" class="small" text-anchor="middle">8. 读取并验证会话（不续期）</text><path d="M995 755 H415" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="705.0" y="742" class="small" text-anchor="middle">9. 当前用户；不存在则401</text><path d="M415 815 H125" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270.0" y="802" class="small" text-anchor="middle">10. 200 {username,role}；随后读取业务</text><path d="M125 885 H415" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="270.0" y="872" class="small" text-anchor="middle">11. POST /api/logout + Bearer令牌</text><path d="M415 945 H995" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705.0" y="932" class="small" text-anchor="middle">12. 验证会话后删除当前会话</text><path d="M415 1005 H125" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="270.0" y="992" class="small" text-anchor="middle">13. 200 {loggedOut:true}；清理前端身份</text><rect x="36" y="1050" width="1048" height="75" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="54" y="1080" class="head" text-anchor="start">分支</text><text x="54" y="1110" class="small" text-anchor="start">口令/令牌错误401；存储不可用503；刷新会丢失内存令牌；MySQL业务记录仍保留。</text><text x="36" y="1158" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.0 · 本地教学样本 / 可编辑 SVG</text></svg>