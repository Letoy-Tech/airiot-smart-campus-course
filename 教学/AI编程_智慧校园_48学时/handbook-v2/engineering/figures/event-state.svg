<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" role="img" aria-labelledby="title desc"><title id="title">状态图｜演练进度与关闭门槛</title><desc id="desc">依据 CaseRules；权限、expectedVersion 与未关闭检查适用于每次后续动作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="900" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">状态图｜演练进度与关闭门槛</text><text x="36" y="77" class="subtitle" text-anchor="start">依据 CaseRules；权限、expectedVersion 与未关闭检查适用于每次后续动作。</text><rect x="385" y="120" width="350" height="85" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="403" y="150" class="head" text-anchor="start">创建演练 / ADMIN</text><text x="403" y="180" class="small" text-anchor="start">设备存在；message非空；version=1</text><rect x="65" y="290" width="260" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="83" y="320" class="head" text-anchor="start">NEW / 待分派</text><text x="83" y="350" class="small" text-anchor="start">设备无责任人</text><text x="83" y="375" class="small" text-anchor="start">assignee=null</text><rect x="455" y="290" width="260" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="473" y="320" class="head" text-anchor="start">ASSIGNED / 已分派</text><text x="473" y="350" class="small" text-anchor="start">设备已有责任人或已assign</text><text x="473" y="375" class="small" text-anchor="start">assignee=manager</text><path d="M445 205 V245 H195 V290" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="234" class="small" text-anchor="start">无责任人</text><path d="M635 205 V290" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="646" y="252" class="small" text-anchor="start">有责任人</text><path d="M325 345 H455" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="329" y="329" class="small" text-anchor="start">assign / ADMIN</text><path d="M715 345 H790 V250 H585 V290" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="796" y="299" class="small" text-anchor="start">assign：可再次分派</text><rect x="455" y="490" width="260" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="473" y="520" class="head" text-anchor="start">IN_PROGRESS / 处理中</text><text x="473" y="550" class="small" text-anchor="start">start：ADMIN或本事件manager</text><text x="473" y="575" class="small" text-anchor="start">记录、恢复、核实不改状态</text><path d="M585 400 V490" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="600" y="454" class="small" text-anchor="start">start</text><rect x="45" y="485" width="325" height="180" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="63" y="515" class="head" text-anchor="start">独立条件</text><text x="63" y="545" class="small" text-anchor="start">note：处置记录非空</text><text x="63" y="570" class="small" text-anchor="start">recover：来源变RECOVERED</text><text x="63" y="595" class="small" text-anchor="start">verify：满足前两项才核实</text><text x="63" y="620" class="small" text-anchor="start">note/recover会清除旧verified</text><path d="M455 550 H370" fill="none" stroke="#406b72" stroke-width="1.8"/><path d="M715 540 H950 V590 H715" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="765" y="520" class="small" text-anchor="start">note / recover / verify</text><rect x="455" y="720" width="260" height="95" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="473" y="750" class="head" text-anchor="start">CLOSED / 已关闭</text><text x="473" y="780" class="small" text-anchor="start">关闭后拒绝所有修改</text><path d="M585 600 V720" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="600" y="654" class="small" text-anchor="start">close + 非空关闭结论</text><rect x="45" y="690" width="365" height="140" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="63" y="720" class="head" text-anchor="start">关闭须同时满足</text><text x="63" y="750" class="small" text-anchor="start">处理中；已有非空处置记录</text><text x="63" y="775" class="small" text-anchor="start">来源已恢复；已经独立核实</text><text x="63" y="800" class="small" text-anchor="start">本次填写非空关闭结论</text><text x="45" y="850" class="small" text-anchor="start">状态/版本不符返回409；成功版本+1并保存时间线与审计；恢复不等于关闭。</text><text x="36" y="878" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.2 · 本地教学样本 / 可编辑 SVG</text></svg>