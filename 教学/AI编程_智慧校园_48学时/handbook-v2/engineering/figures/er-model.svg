<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">ER 图｜教师参考物理表</title><desc id="desc">实线：真实外键（箭头指被引用表）；虚线：逻辑关联。0..N 表示可以没有，也可以多条。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b72"/></marker></defs><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18373d}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#49656b}.label{font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:650}</style><rect width="1120" height="1120" fill="#f8fbfa"/><text x="36" y="45" class="title" text-anchor="start">ER 图｜教师参考物理表</text><text x="36" y="77" class="subtitle" text-anchor="start">实线：真实外键（箭头指被引用表）；虚线：逻辑关联。0..N 表示可以没有，也可以多条。</text><rect x="40" y="130" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="160" class="head" text-anchor="start">spaces / 空间</text><text x="58" y="190" class="small" text-anchor="start">PK id</text><text x="58" y="215" class="small" text-anchor="start">name, building, floor</text><rect x="415" y="130" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="433" y="160" class="head" text-anchor="start">devices / 设备</text><text x="433" y="190" class="small" text-anchor="start">PK id；FK space_id</text><text x="433" y="215" class="small" text-anchor="start">online 可空；simulated</text><rect x="790" y="130" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="808" y="160" class="head" text-anchor="start">users / 用户</text><text x="808" y="190" class="small" text-anchor="start">PK username</text><text x="808" y="215" class="small" text-anchor="start">password_hash, role</text><path d="M415 185 H325" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="334" y="164" class="small" text-anchor="start">0..N → 1</text><rect x="40" y="340" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="370" class="head" text-anchor="start">points / 当前点</text><text x="58" y="400" class="small" text-anchor="start">PK (device_id, tag_id)</text><text x="58" y="425" class="small" text-anchor="start">FK device_id；payload JSON</text><rect x="40" y="535" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="565" class="head" text-anchor="start">history / 历史</text><text x="58" y="595" class="small" text-anchor="start">PK (device_id, tag_id)</text><text x="58" y="620" class="small" text-anchor="start">FK device_id；payload JSON</text><rect x="40" y="730" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="760" class="head" text-anchor="start">alarms / 原始报警</text><text x="58" y="790" class="small" text-anchor="start">PK id；FK device_id</text><text x="58" y="815" class="small" text-anchor="start">payload JSON；只读</text><path d="M325 395 H360 V270 H500 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="375" y="290" class="small" text-anchor="start">点0..N → 设备1</text><path d="M325 590 H375 V305 H550 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325 785 H390 V315 H600 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="42" y="306" class="small" text-anchor="start">当前点 / 历史 / 报警各属于1台设备</text><path d="M180 535 V450" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5"/><text x="50" y="498" class="small" text-anchor="start">同device/tag；无联合FK</text><rect x="415" y="365" width="285" height="135" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="433" y="395" class="head" text-anchor="start">owners / 当前责任</text><text x="433" y="425" class="small" text-anchor="start">PK/FK device_id</text><text x="433" y="450" class="small" text-anchor="start">FK username；note, version</text><text x="433" y="475" class="small" text-anchor="start">每台设备0..1条责任</text><path d="M540 365 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="331" class="small" text-anchor="start">责任0..1 → 设备1</text><path d="M700 410 H747 V180 H790" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="764" y="314" class="small" text-anchor="start">0..N → 用户1</text><rect x="790" y="365" width="285" height="165" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="808" y="395" class="head" text-anchor="start">cases / 演练事件</text><text x="808" y="425" class="small" text-anchor="start">PK id；FK device_id</text><text x="808" y="450" class="small" text-anchor="start">FK assignee 可空</text><text x="808" y="475" class="small" text-anchor="start">state, version 等</text><text x="808" y="500" class="small" text-anchor="start">timeline JSON：无独立时间线表</text><path d="M875 365 V280 H670 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="748" y="265" class="small" text-anchor="start">事件0..N → 设备1</text><path d="M1010 365 V240" fill="none" stroke="#406b72" stroke-width="1.8" marker-end="url(#arrow)"/><text x="800" y="346" class="small" text-anchor="start">事件0..N → 用户0..1</text><rect x="790" y="660" width="285" height="135" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="808" y="690" class="head" text-anchor="start">audit / 审计</text><text x="808" y="720" class="small" text-anchor="start">PK id；time, username</text><text x="808" y="745" class="small" text-anchor="start">action, target, detail</text><text x="808" y="770" class="small" text-anchor="start">无任何外键</text><path d="M930 660 V530" fill="none" stroke="#406b72" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="945" y="599" class="small" text-anchor="start">target可指事件ID</text><text x="795" y="830" class="small" text-anchor="start">username与用户是逻辑关联；</text><text x="795" y="856" class="small" text-anchor="start">target还可指空间/设备，无统一FK。</text><rect x="415" y="730" width="285" height="110" rx="12" fill="#ffffff" stroke="#80a5a8" stroke-width="1.6"/><text x="433" y="760" class="head" text-anchor="start">course_seed / 初始化</text><text x="433" y="790" class="small" text-anchor="start">PK id；applied_at</text><text x="433" y="815" class="small" text-anchor="start">独立初始化标记，无业务外键</text><rect x="40" y="910" width="1035" height="120" rx="12" fill="#edf5f1" stroke="#80a5a8" stroke-width="1.6"/><text x="58" y="940" class="head" text-anchor="start">读图提醒</text><text x="58" y="970" class="small" text-anchor="start">案例与原始报警无alarmId关系；两者只是都关联设备。</text><text x="58" y="995" class="small" text-anchor="start">MySQL业务表10张；Redis会话不在此图；Flyway内部历史表不计入课程业务模型。</text><text x="36" y="1098" class="small" text-anchor="start">AIRIOT 智慧校园课堂 · V2.1.1 · 本地教学样本 / 可编辑 SVG</text></svg>