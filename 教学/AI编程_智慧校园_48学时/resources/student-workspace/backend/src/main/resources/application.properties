spring.application.name=campus-course-backend
spring.profiles.default=first-chain
server.address=127.0.0.1
server.port=8091
server.servlet.session.cookie.name=COURSESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.default-property-inclusion=always
course.catalog-path=${COURSE_CATALOG_PATH:../fixtures/catalog.json}
course.passwords.admin=${COURSE_ADMIN_PASSWORD:}
course.passwords.manager-a=${COURSE_MANAGER_A_PASSWORD:}
course.passwords.manager-b=${COURSE_MANAGER_B_PASSWORD:}
course.passwords.viewer=${COURSE_VIEWER_PASSWORD:}
