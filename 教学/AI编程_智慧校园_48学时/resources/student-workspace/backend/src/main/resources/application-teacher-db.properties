# TEMPLATE ONLY. A teacher must supply and verify a dedicated database before use.
spring.datasource.url=${COURSE_DB_URL}
spring.datasource.username=${COURSE_DB_USERNAME}
spring.datasource.password=${COURSE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=${COURSE_DB_MIGRATE:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
mybatis.configuration.map-underscore-to-camel-case=true
