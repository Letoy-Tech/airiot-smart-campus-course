name: campus-v2
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_course
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先运行 node tools/setup-env.mjs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行 node tools/setup-env.mjs}
    ports:
      - "127.0.0.1:23501:3306"
    volumes:
      - campus-v2-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -u campus -D campus_course -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:7.4
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先运行 node tools/setup-env.mjs}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    ports:
      - "127.0.0.1:23502:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  campus-v2-mysql:
