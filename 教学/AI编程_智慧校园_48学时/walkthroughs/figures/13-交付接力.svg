<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">从自己的电脑，交给下一位同学</title><desc id="desc">保留原工程和原记录；接手者使用自己的账号与教师分组数据库。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="530" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">从自己的电脑，交给下一位同学</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">保留原工程和原记录；接手者使用自己的账号与教师分组数据库。</text><rect x="36" y="140" width="272" height="215" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="54" y="182" font-size="23" fill="#126b53" font-weight="700">原工程 app</text><text x="54" y="227" font-size="18" fill="#17352f" font-weight="400">自己的代码、锁文件</text><text x="54" y="264" font-size="18" fill="#17352f" font-weight="400">docs/evidence与设计资料</text><text x="54" y="301" font-size="18" fill="#17352f" font-weight="400">本机.private留在原地</text><rect x="364" y="140" width="272" height="215" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="382" y="182" font-size="23" fill="#126b53" font-weight="700">生成交付目录</text><text x="382" y="227" font-size="18" fill="#17352f" font-weight="400">node tools/hand-in.mjs</text><text x="382" y="264" font-size="18" fill="#17352f" font-weight="400">排除密码、依赖、运行目录</text><text x="382" y="301" font-size="18" fill="#17352f" font-weight="400">人工检查后压缩ZIP</text><rect x="692" y="140" width="272" height="215" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="710" y="182" font-size="23" fill="#126b53" font-weight="700">同伴解压复现</text><text x="710" y="227" font-size="18" fill="#17352f" font-weight="400">新目录安装依赖、init</text><text x="710" y="264" font-size="18" fill="#17352f" font-weight="400">取得教师分配的隔离库</text><text x="710" y="301" font-size="18" fill="#17352f" font-weight="400">记录成功、失败与未执行</text><path d="M313 243 L353 243" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M640 243 L681 243" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="36" y="393" width="928" height="75" rx="14" fill="#fff9e9" stroke="#d5e3dc"/><text x="58" y="439" font-size="20" fill="#17352f" font-weight="600">交付是别人按说明能接手；压缩成功不等于已经部署，更不等于接入真实设备。</text><text x="36" y="508" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>