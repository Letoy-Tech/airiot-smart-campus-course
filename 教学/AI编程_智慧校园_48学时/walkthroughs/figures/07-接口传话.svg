<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">页面和后台怎样传话</title><desc id="desc">以设备目录为例；本图省略字段，仅用于解释接口的作用。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="530" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">页面和后台怎样传话</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">以设备目录为例；本图省略字段，仅用于解释接口的作用。</text><rect x="36" y="135" width="272" height="200" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="54" y="177" font-size="22" fill="#126b53" font-weight="700">页面：提出请求</text><text x="54" y="225" font-size="16" fill="#17352f" font-weight="400">我要看设备目录</text><text x="54" y="263" font-size="16" fill="#17352f" font-weight="400">GET /api/campus/devices</text><rect x="364" y="135" width="272" height="200" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="382" y="177" font-size="22" fill="#126b53" font-weight="700">后端：检查并取数</text><text x="382" y="225" font-size="16" fill="#17352f" font-weight="400">先检查是谁、有无权限</text><text x="382" y="263" font-size="16" fill="#17352f" font-weight="400">再从教学数据源读取</text><rect x="692" y="135" width="272" height="200" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="710" y="177" font-size="22" fill="#126b53" font-weight="700">数据源：给出记录</text><text x="710" y="225" font-size="16" fill="#17352f" font-weight="400">teaching_env_01</text><text x="710" y="263" font-size="16" fill="#17352f" font-weight="400">online: true</text><path d="M313 235 L353 235" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M640 235 L681 235" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="36" y="380" width="928" height="92" rx="14" fill="#fff9e9" stroke="#d5e3dc"/><text x="58" y="415" font-size="21" fill="#17352f" font-weight="700">接口约定就是两边事先说好：</text><text x="58" y="448" font-size="18" fill="#17352f" font-weight="400">要哪个地址、带什么条件、返回什么字段、失败时怎样解释。先写约定，再写程序。</text><text x="36" y="508" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>