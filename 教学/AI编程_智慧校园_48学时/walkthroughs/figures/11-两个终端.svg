<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc"><title id="title">为什么要开两个终端</title><desc id="desc">终端在持续输出服务日志时，不再往里面粘贴下一条构建命令。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="505" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">为什么要开两个终端</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">终端在持续输出服务日志时，不再往里面粘贴下一条构建命令。</text><rect x="36" y="135" width="438" height="255" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><rect x="526" y="135" width="438" height="255" rx="14" fill="#faf8f1" stroke="#d5e3dc"/><text x="60" y="178" font-size="25" fill="#126b53" font-weight="700">终端 A：后端</text><text x="60" y="224" font-size="18" fill="#17352f" font-weight="400">位置：campus-ai-lab/app</text><text x="60" y="259" font-size="18" fill="#17352f" font-weight="400">第04篇：node tools/course.mjs backend</text><text x="60" y="294" font-size="18" fill="#17352f" font-weight="400">第05篇起：node tools/course.mjs backend-db</text><text x="60" y="329" font-size="18" fill="#17352f" font-weight="400">同一时间只运行其中一个</text><text x="60" y="364" font-size="18" fill="#17352f" font-weight="400">Ctrl+C 停止本人后端</text><text x="550" y="178" font-size="25" fill="#126b53" font-weight="700">终端 B：前端</text><text x="550" y="224" font-size="18" fill="#17352f" font-weight="400">位置：同一份 app</text><text x="550" y="259" font-size="18" fill="#17352f" font-weight="400">node tools/course.mjs frontend</text><text x="550" y="294" font-size="18" fill="#17352f" font-weight="400">浏览器打开 127.0.0.1:5178</text><text x="550" y="329" font-size="18" fill="#17352f" font-weight="400">修改前端并保存后观察刷新</text><text x="550" y="364" font-size="18" fill="#17352f" font-weight="400">Ctrl+C 停止本人前端</text><text x="40" y="440" font-size="20" fill="#17352f" font-weight="600">修改 Java：停止 A → build → 重启 A。修改前端：保存 → 看 Vite 与页面。</text><text x="36" y="483" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>