<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从网页建议到真正保存的代码</title><desc id="desc">AI 的“已完成”不会改变电脑上的文件。你要亲自替换、保存和执行。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="540" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">从网页建议到真正保存的代码</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">AI 的“已完成”不会改变电脑上的文件。你要亲自替换、保存和执行。</text><rect x="36" y="135" width="220" height="205" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="52" y="180" font-size="23" fill="#126b53" font-weight="700">1 找文件</text><text x="52" y="232" font-size="17" fill="#17352f" font-weight="400">Ctrl/Command+P</text><text x="52" y="272" font-size="17" fill="#17352f" font-weight="400">输入完整源文件路径</text><path d="M260 236 L273 236" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="280" y="135" width="220" height="205" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="296" y="180" font-size="23" fill="#126b53" font-weight="700">2 发上下文</text><text x="296" y="232" font-size="17" fill="#17352f" font-weight="400">复制当前源文件给AI</text><text x="296" y="272" font-size="17" fill="#17352f" font-weight="400">再发送本步提示词</text><path d="M504 236 L517 236" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="524" y="135" width="220" height="205" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="540" y="180" font-size="23" fill="#126b53" font-weight="700">3 只换小块</text><text x="540" y="232" font-size="17" fill="#17352f" font-weight="400">定位BEGIN和END</text><text x="540" y="272" font-size="17" fill="#17352f" font-weight="400">保留标记与外层函数</text><path d="M748 236 L761 236" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="768" y="135" width="220" height="205" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="784" y="180" font-size="23" fill="#126b53" font-weight="700">4 保存并检查</text><text x="784" y="232" font-size="17" fill="#17352f" font-weight="400">Ctrl/Command+S</text><text x="784" y="272" font-size="17" fill="#17352f" font-weight="400">运行本章针对性测试</text><rect x="36" y="377" width="928" height="100" rx="14" fill="#fff9e9" stroke="#d5e3dc"/><text x="58" y="417" font-size="22" fill="#17352f" font-weight="700">出错时：复制失败用例或错误原文，让 AI 只改本步代码。</text><text x="58" y="453" font-size="18" fill="#17352f" font-weight="400">代码留在 app；运行记录留在 app/evidence；前面设计仍在 campus-ai-lab/docs。</text><text x="36" y="518" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>