<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">把“设备页要好用”改成可以检查的要求</title><desc id="desc">同样没有设备列表，可能是查询成功为空，也可能是请求失败。两者必须分开。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="555" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">把“设备页要好用”改成可以检查的要求</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">同样没有设备列表，可能是查询成功为空，也可能是请求失败。两者必须分开。</text><text x="58" y="136" font-size="19" fill="#126b53" font-weight="700">情况</text><text x="247" y="136" font-size="19" fill="#126b53" font-weight="700">AI 文档里要写的条件</text><text x="598" y="136" font-size="19" fill="#126b53" font-weight="700">未来页面应该怎样显示</text><rect x="36" y="158" width="928" height="64" rx="9" fill="#f1f6f1" stroke="#d5e3dc"/><text x="58" y="198" font-size="20" fill="#17352f" font-weight="650">正常</text><text x="247" y="198" font-size="19" fill="#17352f" font-weight="400">读取成功，items 有设备</text><text x="598" y="198" font-size="19" fill="#17352f" font-weight="400">显示设备、位置与真实状态</text><rect x="36" y="236" width="928" height="64" rx="9" fill="#faf8f1" stroke="#d5e3dc"/><text x="58" y="276" font-size="20" fill="#17352f" font-weight="650">空目录</text><text x="247" y="276" font-size="19" fill="#17352f" font-weight="400">读取成功，items 是空数组</text><text x="598" y="276" font-size="19" fill="#17352f" font-weight="400">显示“目录暂无设备”</text><rect x="36" y="314" width="928" height="64" rx="9" fill="#f1f6f1" stroke="#d5e3dc"/><text x="58" y="354" font-size="20" fill="#17352f" font-weight="650">请求失败</text><text x="247" y="354" font-size="19" fill="#17352f" font-weight="400">没有成功取得数据</text><text x="598" y="354" font-size="19" fill="#17352f" font-weight="400">显示“读取失败”，提供重试</text><rect x="36" y="392" width="928" height="64" rx="9" fill="#faf8f1" stroke="#d5e3dc"/><text x="58" y="432" font-size="20" fill="#17352f" font-weight="650">状态未知</text><text x="247" y="432" font-size="19" fill="#17352f" font-weight="400">设备的 online 为 null</text><text x="598" y="432" font-size="19" fill="#17352f" font-weight="400">显示“未知”，不能显示离线</text><text x="40" y="502" font-size="19" fill="#536b63" font-weight="400">这张图写的是检查目标。此时还没有程序，不能把它写成“测试通过”。</text><text x="36" y="533" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>