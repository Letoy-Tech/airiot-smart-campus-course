<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">发送的是要求，保存的是回答</title><desc id="desc">先复制 AI 的回答，再回本教程下载；不要把“提问＋回答”整页当作文档。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="500" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">发送的是要求，保存的是回答</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">先复制 AI 的回答，再回本教程下载；不要把“提问＋回答”整页当作文档。</text><rect x="36" y="120" width="444" height="320" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><rect x="520" y="120" width="444" height="320" rx="14" fill="#faf8f1" stroke="#d5e3dc"/><text x="60" y="158" font-size="23" fill="#126b53" font-weight="700">A. 发给 AI：提出要求</text><text x="60" y="203" font-size="18" fill="#17352f" font-weight="400">请只输出四行普通文字：</text><text x="60" y="238" font-size="18" fill="#17352f" font-weight="400"># 我的第一次项目记录</text><text x="60" y="273" font-size="18" fill="#17352f" font-weight="400">项目名称：智慧校园教学平台</text><text x="60" y="308" font-size="18" fill="#17352f" font-weight="400">本次目标：学会保存AI回答</text><text x="60" y="343" font-size="18" fill="#17352f" font-weight="400">完成状态：等待下载并检查</text><text x="544" y="158" font-size="23" fill="#17352f" font-weight="700">B. 保存工具：放入回答</text><text x="544" y="202" font-size="19" fill="#17352f" font-weight="400">文件名：00-保存练习.md</text><rect x="544" y="220" width="396" height="132" rx="14" fill="white" stroke="#d5e3dc"/><text x="560" y="250" font-size="16" fill="#17352f" font-weight="400"># 我的第一次项目记录</text><text x="560" y="277" font-size="16" fill="#17352f" font-weight="400">项目名称：智慧校园教学平台</text><text x="560" y="304" font-size="16" fill="#17352f" font-weight="400">本次目标：学会保存AI回答</text><text x="560" y="331" font-size="16" fill="#17352f" font-weight="400">完成状态：等待下载并检查</text><rect x="544" y="372" width="220" height="44" rx="8" fill="#126b53" stroke="#126b53"/><text x="562" y="401" font-size="19" fill="white" font-weight="600">下载这个 .md 文件</text><path d="M484 280 L510 280" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="36" y="478" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>