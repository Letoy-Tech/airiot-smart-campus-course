<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">先画页面承载什么信息，再决定颜色和样式</title><desc id="desc">简化线框：位置、字样和按钮用于讨论功能；它不是已经实现的平台。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="555" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">先画页面承载什么信息，再决定颜色和样式</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">简化线框：位置、字样和按钮用于讨论功能；它不是已经实现的平台。</text><rect x="36" y="122" width="928" height="340" rx="14" fill="white" stroke="#d5e3dc"/><rect x="36" y="122" width="180" height="340" rx="0" fill="#eef5ed" stroke="#d5e3dc"/><text x="55" y="158" font-size="20" fill="#126b53" font-weight="700">教学智慧校园</text><text x="58" y="213" font-size="19" fill="#17352f" font-weight="400">设备目录</text><text x="58" y="263" font-size="19" fill="#17352f" font-weight="400">位置管理</text><text x="58" y="313" font-size="19" fill="#17352f" font-weight="400">演练事件</text><text x="240" y="158" font-size="23" fill="#17352f" font-weight="700">设备目录</text><text x="760" y="157" font-size="17" fill="#126b53" font-weight="400">教学模拟数据</text><rect x="240" y="181" width="325" height="42" rx="7" fill="#fafaf7" stroke="#d5e3dc"/><text x="255" y="209" font-size="16" fill="#536b63" font-weight="400">搜索设备名称…</text><rect x="580" y="181" width="180" height="42" rx="7" fill="#fafaf7" stroke="#d5e3dc"/><text x="594" y="209" font-size="16" fill="#536b63" font-weight="400">空间01  ▾</text><text x="240" y="265" font-size="18" fill="#536b63" font-weight="400">设备名称 / ID</text><text x="623" y="265" font-size="18" fill="#536b63" font-weight="400">通信状态</text><text x="785" y="265" font-size="18" fill="#536b63" font-weight="400">操作</text><text x="240" y="307" font-size="17" fill="#17352f" font-weight="400">环境设备 / teaching_env_01</text><text x="623" y="307" font-size="19" fill="#126b53" font-weight="650">在线</text><text x="785" y="307" font-size="17" fill="#126b53" font-weight="400">查看点值 →</text><text x="240" y="350" font-size="17" fill="#17352f" font-weight="400">能耗设备 / teaching_energy_01</text><text x="623" y="350" font-size="19" fill="#896618" font-weight="650">未知</text><text x="785" y="350" font-size="17" fill="#126b53" font-weight="400">查看点值 →</text><text x="240" y="413" font-size="17" fill="#536b63" font-weight="400">空目录、读取失败、未知状态分别显示不同提示。</text><text x="40" y="503" font-size="19" fill="#126b53" font-weight="600">位置管理只有管理员能写；查看者即使看到页面也不能修改。</text><text x="36" y="533" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>