<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc"><title id="title">不要让一个需求走着走着消失了</title><desc id="desc">文档的价值在于前后能接上，不是数量越多越好。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="515" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">不要让一个需求走着走着消失了</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">文档的价值在于前后能接上，不是数量越多越好。</text><rect x="36" y="138" width="220" height="188" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="52" y="181" font-size="21" fill="#126b53" font-weight="700">想解决的问题</text><text x="52" y="229" font-size="17" fill="#17352f" font-weight="400">值班人员找不到设备</text><path d="M260 233 L273 233" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="280" y="138" width="220" height="188" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="296" y="181" font-size="21" fill="#126b53" font-weight="700">需求 R01</text><text x="296" y="229" font-size="17" fill="#17352f" font-weight="400">能筛选目录</text><text x="296" y="263" font-size="17" fill="#17352f" font-weight="400">未知不等于离线</text><path d="M504 233 L517 233" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="524" y="138" width="220" height="188" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="540" y="181" font-size="21" fill="#126b53" font-weight="700">页面＋数据＋接口</text><text x="540" y="229" font-size="17" fill="#17352f" font-weight="400">目录页显示三种状态</text><text x="540" y="263" font-size="17" fill="#17352f" font-weight="400">保留 online 原值</text><path d="M748 233 L761 233" stroke="#126b53" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="768" y="138" width="220" height="188" rx="14" fill="#f1f6f1" stroke="#d5e3dc"/><text x="784" y="181" font-size="21" fill="#126b53" font-weight="700">开发与检查</text><text x="784" y="229" font-size="17" fill="#17352f" font-weight="400">先做一次读取</text><text x="784" y="263" font-size="17" fill="#17352f" font-weight="400">再分别检查空与失败</text><rect x="36" y="367" width="928" height="95" rx="14" fill="#faf8f1" stroke="#d5e3dc"/><text x="58" y="405" font-size="23" fill="#17352f" font-weight="650">每次往后走，都要回头对照同一条需求。</text><text x="58" y="440" font-size="19" fill="#536b63" font-weight="400">例如需求写了“位置绑定”，页面、数据、接口、开发任务中也必须找得到它。</text><text x="36" y="493" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>