<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">你的作业放在这里</title><desc id="desc">蓝色文字是先建的两个文件夹；下面的文件随着教程逐个增加。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#126b53"/></marker></defs><rect width="1000" height="510" fill="#fffefa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="48" font-size="28" fill="#17352f" font-weight="700">你的作业放在这里</text><text x="36" y="82" font-size="17" fill="#536b63" font-weight="400">蓝色文字是先建的两个文件夹；下面的文件随着教程逐个增加。</text><rect x="36" y="120" width="928" height="335" rx="14" fill="#f8faf7" stroke="#d5e3dc"/><text x="66" y="160" font-size="25" fill="#17352f" font-weight="700">桌面</text><text x="100" y="212" font-size="25" fill="#126b53" font-weight="700">▸ campus-ai-lab</text><text x="140" y="260" font-size="25" fill="#126b53" font-weight="700">▸ docs</text><text x="188" y="306" font-size="21" fill="#17352f" font-weight="400">01-项目想法.md</text><text x="188" y="343" font-size="21" fill="#17352f" font-weight="400">02-范围确认.md</text><text x="188" y="380" font-size="21" fill="#17352f" font-weight="400">03-项目任务书.md</text><text x="188" y="417" font-size="21" fill="#17352f" font-weight="400">……直到 11-开发任务.md</text><rect x="605" y="165" width="315" height="215" rx="14" fill="#fff9e9" stroke="#d5e3dc"/><text x="627" y="202" font-size="23" fill="#17352f" font-weight="700">保存后的检查</text><text x="627" y="245" font-size="19" fill="#17352f" font-weight="400">1. 文件名与教程一致</text><text x="627" y="277" font-size="19" fill="#17352f" font-weight="400">2. 重新打开有正文</text><text x="627" y="309" font-size="19" fill="#17352f" font-weight="400">3. 中文显示正常</text><text x="627" y="341" font-size="19" fill="#17352f" font-weight="400">4. 文件在 docs 里面</text><text x="36" y="488" font-size="14" fill="#536b63" font-weight="400">智慧校园 AI 编程 · 教学示意 · 不是模型网页截图或运行结果</text></g></svg>