# -----------------------------------------------------------------------------
# Publish profile
# Keep production values externalized through environment variables.
# -----------------------------------------------------------------------------

# Server / web
server.port=${SERVER_PORT:8001}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}

# Datasource / Hikari
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=${DB_POOL_NAME:backend-template-prod-pool}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_TIME:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.connection-test-query=${DB_CONNECTION_TEST_QUERY:SELECT 1}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.letoy.main=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:WARN}
logging.level.org.mybatis=${LOG_LEVEL_MYBATIS:WARN}

# Security / whitelist
security.api-rule.sync-redis=${SECURITY_API_RULE_SYNC_REDIS:true}
whitelist.strict-mode=${WHITELIST_STRICT_MODE:true}
whitelist.allow-business-apis=${WHITELIST_ALLOW_BUSINESS_APIS:false}

# Kafka / user behavior log
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
spring.kafka.producer.value-serializer=${KAFKA_PRODUCER_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
spring.kafka.producer.acks=${KAFKA_ACKS:all}
spring.kafka.producer.retries=${KAFKA_RETRIES:5}
spring.kafka.consumer.key-deserializer=${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
spring.kafka.consumer.value-deserializer=${KAFKA_CONSUMER_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.listener.missing-topics-fatal=${KAFKA_MISSING_TOPICS_FATAL:false}
behavior.log.enabled=${BEHAVIOR_LOG_ENABLED:true}
behavior.log.producer-enabled=${BEHAVIOR_LOG_PRODUCER_ENABLED:true}
behavior.log.consumer-enabled=${BEHAVIOR_LOG_CONSUMER_ENABLED:true}
behavior.log.direct-fallback-enabled=${BEHAVIOR_LOG_DIRECT_FALLBACK_ENABLED:true}
behavior.log.topic=${BEHAVIOR_LOG_TOPIC:user-behavior-log}
behavior.log.consumer-group=${BEHAVIOR_LOG_CONSUMER_GROUP:letoy-wagf-behavior-log}
behavior.log.max-request-target-length=${BEHAVIOR_LOG_MAX_REQUEST_TARGET_LENGTH:512}
behavior.log.max-query-string-length=${BEHAVIOR_LOG_MAX_QUERY_STRING_LENGTH:255}
behavior.log.max-user-agent-length=${BEHAVIOR_LOG_MAX_USER_AGENT_LENGTH:512}
behavior.log.max-error-message-length=${BEHAVIOR_LOG_MAX_ERROR_MESSAGE_LENGTH:255}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:backend-template}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:15552000000}
jwt.revocation-strategy=${JWT_REVOCATION_STRATEGY:VERSION}
jwt.legacy-mode=${JWT_LEGACY_MODE:false}
jwt.blacklist.key-prefix=${JWT_BLACKLIST_KEY_PREFIX:JWT:BLACKLIST:}
jwt.blacklist.check-enabled=${JWT_BLACKLIST_CHECK_ENABLED:false}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}

# Aliyun
aliyun.access-key-id=${ALIBABA_CLOUD_ACCESS_KEY_ID:}
aliyun.access-key-secret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
aliyun.sms-sign-name=${ALIBABA_CLOUD_SMS_SIGN_NAME:}
aliyun.sms-region=${ALIBABA_CLOUD_SMS_REGION:cn-hongkong}
aliyun.sms-endpoint=${ALIBABA_CLOUD_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
aliyun.global-sms-region=${ALIBABA_CLOUD_GLOBAL_SMS_REGION:cn-hangzhou}
aliyun.global-sms-domain=${ALIBABA_CLOUD_GLOBAL_SMS_DOMAIN:dysmsapi.aliyuncs.com}
aliyun.captcha-endpoint=${ALIBABA_CLOUD_CAPTCHA_ENDPOINT:captcha.cn-shanghai.aliyuncs.com}
aliyun.captcha-scene-id=${ALIBABA_CLOUD_CAPTCHA_SCENE_ID:}
aliyun.login-template-code=${ALIBABA_CLOUD_LOGIN_TEMPLATE_CODE:}
aliyun.bind-phone-template-code=${ALIBABA_CLOUD_BIND_PHONE_TEMPLATE_CODE:}
aliyun.reset-phone-template-code=${ALIBABA_CLOUD_RESET_PHONE_TEMPLATE_CODE:}
aliyun.connect-timeout=${ALIBABA_CLOUD_CONNECT_TIMEOUT:5000}
aliyun.read-timeout=${ALIBABA_CLOUD_READ_TIMEOUT:5000}

# Spring AI / DashScope compatible OpenAI endpoint
spring.ai.model.chat=${SPRING_AI_CHAT_MODEL:openai}
spring.ai.openai.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
spring.ai.openai.api-key=${QWEN_API_KEY:}
spring.ai.openai.chat.options.model=${DASHSCOPE_MODEL:qwen3-vl-flash}
spring.ai.openai.chat.options.temperature=${DASHSCOPE_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${DASHSCOPE_MAX_TOKENS:2000}
spring.ai.model.embedding=${SPRING_AI_EMBEDDING_MODEL:none}
spring.ai.model.image=none
spring.ai.model.moderation=${SPRING_AI_MODERATION_MODEL:none}
spring.ai.model.audio.speech=${SPRING_AI_AUDIO_SPEECH_MODEL:none}
spring.ai.model.audio.transcription=${SPRING_AI_AUDIO_TRANSCRIPTION_MODEL:none}
