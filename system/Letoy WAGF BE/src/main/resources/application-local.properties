# Only start through system/scripts/local-runtime.py. Secrets are loaded from the restricted file.
server.address=127.0.0.1
server.port=8001
spring.datasource.url=jdbc:mysql://127.0.0.1:13316/smart_campus?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=smart_campus
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.pool-name=smart-campus-local
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.database=0
spring.data.redis.timeout=3s
security.api-rule.sync-redis=true
template.app-name=smart-campus-local
jwt.issuer=smart-campus-local
jwt.legacy-mode=false
jwt.blacklist.check-enabled=true
spring.ai.model.chat=none
spring.ai.openai.api-key=
aliyun.access-key-id=
aliyun.access-key-secret=
behavior.log.enabled=true
behavior.log.producer-enabled=false
behavior.log.consumer-enabled=false
behavior.log.direct-fallback-enabled=true
spring.kafka.bootstrap-servers=127.0.0.1:19092
whitelist.strict-mode=true
whitelist.allow-business-apis=false
logging.level.com.letoy.main=INFO
logging.level.org.springframework.web.client=OFF
logging.level.org.apache.http=OFF
logging.level.jdk.internal.net.http=OFF
campus.airiot.base-url=${AIRIOT_BASE_URL:}
campus.airiot.project-id=${AIRIOT_PROJECT_ID:000000000000000000000001}
campus.airiot.app-key=${AIRIOT_APP_KEY:}
campus.airiot.app-secret=${AIRIOT_APP_SECRET:}
campus.airiot.control-enabled=false
campus.airiot.timeout-seconds=8
