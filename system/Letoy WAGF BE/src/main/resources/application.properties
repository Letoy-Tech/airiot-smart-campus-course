spring.profiles.default=local
# -----------------------------------------------------------------------------
# Backend template baseline configuration
# This file keeps safe defaults for local startup and acts as the shared base
# for every environment-specific profile.
# -----------------------------------------------------------------------------

# Template / application
spring.application.name=smart-campus-be
template.app-name=smart-campus-local
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

# Server / web
server.port=8001
server.servlet.context-path=/
server.shutdown=graceful
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jackson.time-zone=UTC

# Datasource / Hikari
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CAMPUS_DB_URL:jdbc:mysql://127.0.0.1:13316/smart_campus?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
&socketTimeout=30000
spring.datasource.username=${CAMPUS_DB_USERNAME:smart_campus}
spring.datasource.password=${CAMPUS_DB_PASSWORD:}

spring.datasource.hikari.pool-name=backend-template-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# Redis Config
spring.data.redis.host=${CAMPUS_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${CAMPUS_REDIS_PORT:16379}
spring.data.redis.database=1
spring.data.redis.password=${CAMPUS_REDIS_PASSWORD:}
spring.data.redis.timeout=5000
spring.redis.notify-keyspace-events = Ex


# MyBatis / persistence
mybatis_config_file=mybatis-config.xml
mapper_path=classpath*:/mapper/*.xml
entity_package=com.letoy.main.auth.entity,com.letoy.main.user.entity,com.letoy.main.role.entity,com.letoy.main.group.entity,com.letoy.main.permission.entity,com.letoy.main.behavior.entity
swagger_scan_packages=com.letoy.main

# PageHelper
pagehelper.propertyName=propertyName
pagehelper.reasonable=true
pagehelper.defaultCount=true
pagehelper.supportMethodsArguments=true

# Logging
logging.config=classpath:logback-spring.xml
logging.level.root=INFO
logging.level.com.letoy.main=INFO

# Security / API rule cache
security.api-rule.sync-redis=true
spring.http.client.factory=simple

# Kafka / user behavior log
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=${KAFKA_ACKS:all}
spring.kafka.producer.retries=${KAFKA_RETRIES:3}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:latest}
spring.kafka.listener.missing-topics-fatal=false
behavior.log.enabled=${BEHAVIOR_LOG_ENABLED:true}
behavior.log.producer-enabled=false
behavior.log.consumer-enabled=false
behavior.log.direct-fallback-enabled=${BEHAVIOR_LOG_DIRECT_FALLBACK_ENABLED:true}
behavior.log.topic=${BEHAVIOR_LOG_TOPIC:user-behavior-log}
behavior.log.consumer-group=${BEHAVIOR_LOG_CONSUMER_GROUP:letoy-wagf-behavior-log}
behavior.log.max-request-target-length=${BEHAVIOR_LOG_MAX_REQUEST_TARGET_LENGTH:512}
behavior.log.max-query-string-length=${BEHAVIOR_LOG_MAX_QUERY_STRING_LENGTH:255}
behavior.log.max-user-agent-length=${BEHAVIOR_LOG_MAX_USER_AGENT_LENGTH:512}
behavior.log.max-error-message-length=${BEHAVIOR_LOG_MAX_ERROR_MESSAGE_LENGTH:255}

# JWT
jwt.secret=${CAMPUS_JWT_SECRET:}
jwt.issuer=backend-template
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=15552000000
jwt.revocation-strategy=VERSION
jwt.legacy-mode=false
jwt.blacklist.key-prefix=JWT:BLACKLIST:
jwt.blacklist.check-enabled=false

# Whitelist
whitelist.strict-mode=false
whitelist.allow-business-apis=false
whitelist.core-whitelist[0]=/swagger-ui.html
whitelist.core-whitelist[1]=/swagger-ui/**
whitelist.core-whitelist[2]=/webjars/**
whitelist.core-whitelist[3]=/v3/api-docs/**
whitelist.core-whitelist[4]=/swagger-resources/**
whitelist.core-whitelist[5]=/actuator/health
whitelist.core-whitelist[6]=/aliyun/captcha/verify
whitelist.core-whitelist[7]=/auth/login/phone-code/send
whitelist.core-whitelist[8]=/auth/login/phone-code
whitelist.core-whitelist[9]=/auth/bootstrap
whitelist.core-whitelist[10]=/auth/login
whitelist.core-whitelist[11]=/auth/refresh

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Aliyun
aliyun.access-key-id=${ALIBABA_CLOUD_ACCESS_KEY_ID:}
aliyun.access-key-secret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
aliyun.sms-sign-name=${ALIBABA_CLOUD_SMS_SIGN_NAME:}
aliyun.sms-region=${ALIBABA_CLOUD_SMS_REGION:cn-hongkong}
aliyun.sms-endpoint=${ALIBABA_CLOUD_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
aliyun.global-sms-region=${ALIBABA_CLOUD_GLOBAL_SMS_REGION:cn-hangzhou}
aliyun.global-sms-domain=${ALIBABA_CLOUD_GLOBAL_SMS_DOMAIN:dysmsapi.aliyuncs.com}
aliyun.captcha-endpoint=${ALIBABA_CLOUD_CAPTCHA_ENDPOINT:captcha.cn-shanghai.aliyuncs.com}
aliyun.captcha-scene-id=${ALIBABA_CLOUD_CAPTCHA_SCENE_ID:}
aliyun.login-template-code=${ALIBABA_CLOUD_LOGIN_TEMPLATE_CODE:}
aliyun.bind-phone-template-code=${ALIBABA_CLOUD_BIND_PHONE_TEMPLATE_CODE:}
aliyun.reset-phone-template-code=${ALIBABA_CLOUD_RESET_PHONE_TEMPLATE_CODE:}
aliyun.connect-timeout=${ALIBABA_CLOUD_CONNECT_TIMEOUT:5000}
aliyun.read-timeout=${ALIBABA_CLOUD_READ_TIMEOUT:5000}

# Spring AI / DashScope compatible OpenAI endpoint
spring.ai.model.chat=none
spring.ai.openai.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
spring.ai.openai.api-key=${QWEN_API_KEY:}
spring.ai.openai.chat.options.model=${DASHSCOPE_MODEL:qwen3-vl-flash}
spring.ai.openai.chat.options.temperature=${DASHSCOPE_TEMPERATURE:0.7}
spring.ai.openai.chat.options.max-tokens=${DASHSCOPE_MAX_TOKENS:2000}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
